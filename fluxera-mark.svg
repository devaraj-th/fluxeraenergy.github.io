<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Fluxera mark</title>
  <desc id="desc">A dimensional blue and white F mark for Fluxera.</desc>
  <defs>
    <linearGradient id="face" x1="12" y1="8" x2="82" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".18" stop-color="#dcecff"/>
      <stop offset=".48" stop-color="#75b5ff"/>
      <stop offset=".78" stop-color="#1769d6"/>
      <stop offset="1" stop-color="#073b9c"/>
    </linearGradient>
    <linearGradient id="edge" x1="20" y1="78" x2="84" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#052d78"/>
